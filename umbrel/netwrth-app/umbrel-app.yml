manifestVersion: 1
id: netwrth-app
category: finance
name: Netwrth
version: "1.3.0"
tagline: Crypto, aandelen, ETF's, grondstoffen en vastgoed in één overzicht
description: >-
  Persoonlijke portfolio-tracker in Delta-stijl. Live koersen via de eToro API en Yahoo Finance,
  ECB-wisselkoersen, winst/verlies per aankoop, allocatie, alerts en import van Swissquote/eToro-exports.
  Alle data blijft lokaal op je Umbrel.
releaseNotes: >-
  "Vandaag" rekent met de juiste vorige slot: bij Yahoo-koersen de slot van de vorige handelsdag in plaats
  van die van een week terug, en handmatige koersen en vastgoed tonen geen oud waarderingsverschil meer als
  dagverandering. Op de assetpagina toont "Alles" de hele koershistorie, en er is een periode 5J bij.
