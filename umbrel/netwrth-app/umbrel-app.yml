category: finance
name: Netwrth
version: "1.2.0"
tagline: Crypto, aandelen, ETF's, grondstoffen en vastgoed in één overzicht
description: >-
  Persoonlijke portfolio-tracker in Delta-stijl. Live koersen via de eToro API en Yahoo Finance,
  ECB-wisselkoersen, winst/verlies per aankoop, allocatie, alerts en import van Swissquote/eToro-exports.
  Alle data blijft lokaal op je Umbrel.
releaseNotes: >-
  Pagina's laden veel sneller: de berekening van je posities en de grafiek blijft bewaard tot er iets
  verandert, in plaats van bij elke paginalading opnieuw te gebeuren. Op het overzicht volgt de grafiek
  waarde vs. inleg nu je filter op categorie of platform.
